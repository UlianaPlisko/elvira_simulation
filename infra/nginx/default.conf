# applications/central-manager/nginx.conf (or included file)
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    set_real_ip_from 172.20.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    log_format elvira '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'xff="$http_x_forwarded_for" xrip="$http_x_real_ip"';

    access_log /var/log/nginx/access.log elvira;

    server {
        listen 80 default_server;
        server_name central.elvira.lib elvira.lib;

        location /stub_status {
            stub_status;
            access_log off;
        }

        location / {
            # serve central content (static or app)
            root /usr/share/nginx/html;
            index index.html index.htm;
        }

        # backend for book fetch (used by edges)
        location /books/ {
            root /var/www/elvira;
        }
    }
}
