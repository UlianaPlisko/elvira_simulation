global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'central-node'
    static_configs:
      - targets: ['node-exporter-central:9100']          

  - job_name: 'facultyA-node'
    static_configs:
      - targets: ['node-exporter-facultyA:9100']         

  - job_name: 'nginx-central'
    static_configs:
      - targets: ['nginx-exporter-central:9113']         

  - job_name: 'nginx-facultyA'
    static_configs:
      - targets: ['nginx-exporter-facultyA:9113']        

  - job_name: 'central-custom'
    static_configs:
      - targets: ['central-nginx:3000']                   

  - job_name: 'facultyA-custom'
    static_configs:
      - targets: ['facultyA-edge:3002']                         

  - job_name: 'logporter'
    scrape_interval: 5s                                 
    static_configs:
      - targets: ['logporter:9333']                      