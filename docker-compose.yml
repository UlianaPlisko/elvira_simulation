services:
  central-nginx:
    build:
      context: .
      dockerfile: applications/central-manager/Dockerfile
    image: elvira-simulation-central-nginx
    container_name: central-nginx
    ports:
    - "8080:80"  # Existing
    - "3000:3000"  # For /metrics (Prometheus already scrapes internally, but useful for debug)
    - "3100:3100"  # For /eco-index, /health, etc.
    volumes:
      - ./data:/var/www/books:ro
      - /var/run/docker.sock:/var/run/docker.sock  # Для доступа к Docker daemon
      - .:/project:ro
    networks:
      elvira-net:
        ipv4_address: 172.20.0.2
    depends_on:
      - main-dns
      - secondary-dns
    privileged: true
    profiles: []
  facultyA-edge:
    build:
      context: .
      dockerfile: applications/edge-managers/facultyA/Dockerfile
    image: elvira-simulation-facultya-edge
    container_name: facultyA-edge
    ports:
    - "8081:80"  # Existing
    - "3001:3001"
    volumes:
      - ./data:/var/www/cache:ro
    networks:
      elvira-net:
        ipv4_address: 172.20.0.10
      facultyA-net:
        ipv4_address: 192.168.1.10
    depends_on:
      - central-nginx
    privileged: true
    profiles: []
  main-dns:
    build:
      context: .
      dockerfile: infra/dns/main/Dockerfile  # Point to the copied Dockerfile
    image: elvira-simulation-main-dns  # New image name
    container_name: main-dns
    ports:
      - "53:53/udp"
    volumes:
      - ./infra/dns/main/Corefile:/Corefile:ro
    networks:
      elvira-net:
        ipv4_address: 172.20.0.3
    profiles: []
  secondary-dns:
    build:
      context: .
      dockerfile: infra/dns/secondary/Dockerfile 
    ports:
      - "1053:53/udp"
    volumes:
      - ./infra/dns/secondary/Corefile:/Corefile:ro
    container_name: secondary-dns
    networks:
      elvira-net:
        ipv4_address: 172.20.0.4
      facultyA-net:
        ipv4_address: 192.168.1.5
    sysctls:
      - net.ipv4.ip_forward=1
    cap_add:
      - NET_ADMIN
    profiles: []
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:               
      elvira-net:
        ipv4_address: 172.20.0.5
    profiles: []
  student-facultyA:
    build:
      context: .
      dockerfile: applications/simulators/student-sim/Dockerfile
    image: elvira-sim-student-facultya:latest
    container_name: student-facultyA
    working_dir: /sim
    environment:
      - SIM_CONC=20
      - SIM_DURATION=300
      - SIM_THINK=800
      - SIM_URL=http://elvira.lib/books/
      - SIM_ZIPF_ALPHA=0.9
      - SIM_EXAM_SPIKE_AT=120
      - SIM_EXAM_SPIKE_FACTOR=3
    networks:
      facultyA-net:
        ipv4_address: 192.168.1.50
    dns:
      - 172.20.0.3 
    depends_on:
      - main-dns
      - secondary-dns
    privileged: true
    profiles:  # Add this!
      - simulator
  node-exporter-central:
    image: prom/node-exporter:latest
    container_name: node-exporter-central
    ports:
      - "9100:9100"  # Matches your prometheus.yml
    networks:
      elvira-net:
        ipv4_address: 172.20.0.6
    volumes:
      - /:/host:ro
    command:
      - '--path.rootfs=/host'
    depends_on:
      - central-nginx
    profiles: []
  node-exporter-facultyA:
    image: prom/node-exporter:latest
    container_name: node-exporter-facultyA
    ports:
      - "9101:9100"  # Separate port to avoid conflict
    networks:
      elvira-net:
        ipv4_address: 172.20.0.11
    volumes:
      - /:/host:ro
    command:
      - '--path.rootfs=/host'
    depends_on:
      - facultyA-edge
    profiles: []

  nginx-exporter-central:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter-central
    ports:
      - "9113:9113"
    networks:
      elvira-net:
        ipv4_address: 172.20.0.7
    command:  # Scrape central's stub_status (your metrics.ts uses it)
      - -nginx.scrape-uri=http://172.20.0.2/stub_status
    depends_on:
      - central-nginx
    profiles: []

  nginx-exporter-facultyA:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter-facultyA
    ports:
      - "9114:9113"
    networks:
      elvira-net:
        ipv4_address: 172.20.0.12
    command:
      - -nginx.scrape-uri=http://172.20.0.10/stub_status
    depends_on:
      - facultyA-edge
    profiles: []
  logporter:
    image: lifailon/logporter:latest       
    container_name: logporter
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  
    ports:
      - 9333:9333
    environment:
      - DOCKER_LOG_METRICS=false
      - DOCKER_LOG_CUSTOM_METRICS=false
      - DOCKER_LOG_CUSTOM_QUERY=(err|error|ERR|ERROR)
    depends_on:
      - central-nginx
      - facultyA-edge
    networks:
      elvira-net:
        ipv4_address: 172.20.0.13
    profiles: []
  dashboard:
    build:
      context: ./elvira-dashboard
      dockerfile: Dockerfile
    ports:
      - "3101:3101"  
    command: npm start
    container_name: elvira-dashboard
    depends_on:
      - central-nginx
      - prometheus
    networks:
      elvira-net:
        ipv4_address: 172.20.0.20
    profiles: []
networks:
  elvira-net:
    driver: bridge
    ipam:
      config:
        - subnet: "172.20.0.0/16"
  facultyA-net:
    driver: bridge
    ipam:
      config:
        - subnet: "192.168.1.0/24"