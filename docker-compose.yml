services:
  central-nginx:
    build:
      context: .
      dockerfile: applications/central-manager/Dockerfile
    image: elvira-simulation-central-nginx
    ports:
      - "8080:80"
    networks:
      elvira-net:
        ipv4_address: 172.20.0.2
    depends_on:
      - main-dns
      - secondary-dns
    privileged: true
  facultyA-edge:
    build:
      context: .
      dockerfile: applications/edge-managers/facultyA/Dockerfile
    image: elvira-simulation-facultya-edge
    ports:
      - "8081:80"
    networks:
      elvira-net:
        ipv4_address: 172.20.0.10
    depends_on:
      - central-nginx
    privileged: true
  main-dns:
    build:
      context: .
      dockerfile: infra/dns/main/Dockerfile  # Point to the copied Dockerfile
    image: elvira-simulation-main-dns  # New image name
    ports:
      - "53:53/udp"
    volumes:
      - ./infra/dns/main/Corefile:/Corefile:ro
      - ./infra/dns/main/zones:/zones:ro  # Keep if you have static zones; optional now
    networks:
      elvira-net:
        ipv4_address: 172.20.0.3
  secondary-dns:
    build:
      context: .
      dockerfile: infra/dns/secondary/Dockerfile 
    ports:
      - "1053:53/udp"
    volumes:
      - ./infra/dns/secondary/Corefile:/Corefile:ro
    networks:
      elvira-net:
        ipv4_address: 172.20.0.4
      facultyA-net:
        ipv4_address: 192.168.1.5
    sysctls:
      - net.ipv4.ip_forward=1
    cap_add:
      - NET_ADMIN
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      elvira-net:
        ipv4_address: 172.20.0.5
  student-facultyA:
    build:
      context: .
      dockerfile: applications/simulators/student-sim/Dockerfile
    image: elvira-sim-student-facultya:latest
    container_name: student-facultyA
    working_dir: /sim
    environment:
      - SIM_CONC=20
      - SIM_DURATION=300
      - SIM_THINK=800
      - SIM_URL=http://elvira.lib/books/
      - SIM_ZIPF_ALPHA=0.9
      - SIM_EXAM_SPIKE_AT=120
      - SIM_EXAM_SPIKE_FACTOR=3
    networks:
      facultyA-net:
        ipv4_address: 192.168.1.50
    dns:
      - 172.20.0.3 
    depends_on:
      - main-dns
      - secondary-dns
    privileged: true
networks:
  elvira-net:
    driver: bridge
    ipam:
      config:
        - subnet: "172.20.0.0/16"
  facultyA-net:
    driver: bridge
    ipam:
      config:
        - subnet: "192.168.1.0/24"