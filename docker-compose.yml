services:
  central-nginx:
    build:
      context: .
      dockerfile: applications/central-manager/Dockerfile
    image: elvira-simulation-central-nginx
    ports:
    - "8080:80"  # Existing
    - "3000:3000"  # For /metrics (Prometheus already scrapes internally, but useful for debug)
    - "3100:3100"  # For /eco-index, /health, etc.
    volumes:
      - ./data:/var/www/books:ro
    networks:
      elvira-net:
        ipv4_address: 172.20.0.2
    depends_on:
      - main-dns
      - secondary-dns
    privileged: true
  facultyA-edge:
    build:
      context: .
      dockerfile: applications/edge-managers/facultyA/Dockerfile
    image: elvira-simulation-facultya-edge
    ports:
    - "8081:80"  # Existing
    - "3001:3000"
    volumes:
      - ./data:/var/www/cache:ro
    networks:
      elvira-net:
        ipv4_address: 172.20.0.10
    depends_on:
      - central-nginx
    privileged: true
  main-dns:
    build:
      context: .
      dockerfile: infra/dns/main/Dockerfile  # Point to the copied Dockerfile
    image: elvira-simulation-main-dns  # New image name
    ports:
      - "53:53/udp"
    volumes:
      - ./infra/dns/main/Corefile:/Corefile:ro
      - ./infra/dns/main/zones:/zones:ro  # Keep if you have static zones; optional now
    networks:
      elvira-net:
        ipv4_address: 172.20.0.3
  secondary-dns:
    build:
      context: .
      dockerfile: infra/dns/secondary/Dockerfile 
    ports:
      - "1053:53/udp"
    volumes:
      - ./infra/dns/secondary/Corefile:/Corefile:ro
    networks:
      elvira-net:
        ipv4_address: 172.20.0.4
      facultyA-net:
        ipv4_address: 192.168.1.5
    sysctls:
      - net.ipv4.ip_forward=1
    cap_add:
      - NET_ADMIN
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      elvira-net:
        ipv4_address: 172.20.0.5
  student-facultyA:
    build:
      context: .
      dockerfile: applications/simulators/student-sim/Dockerfile
    image: elvira-sim-student-facultya:latest
    container_name: student-facultyA
    working_dir: /sim
    environment:
      - SIM_CONC=20
      - SIM_DURATION=300
      - SIM_THINK=800
      - SIM_URL=http://elvira.lib/books/
      - SIM_ZIPF_ALPHA=0.9
      - SIM_EXAM_SPIKE_AT=120
      - SIM_EXAM_SPIKE_FACTOR=3
    networks:
      facultyA-net:
        ipv4_address: 192.168.1.50
    dns:
      - 172.20.0.3 
    depends_on:
      - main-dns
      - secondary-dns
    privileged: true
  node-exporter-central:
    image: prom/node-exporter:latest
    container_name: node-exporter-central
    ports:
      - "9100:9100"  # Matches your prometheus.yml
    networks:
      elvira-net:
        ipv4_address: 172.20.0.6
    volumes:
      - /:/host:ro
    command:
      - '--path.rootfs=/host'
    depends_on:
      - central-nginx
  node-exporter-facultyA:
    image: prom/node-exporter:latest
    container_name: node-exporter-facultyA
    ports:
      - "9101:9100"  # Separate port to avoid conflict
    networks:
      elvira-net:
        ipv4_address: 172.20.0.11
    volumes:
      - /:/host:ro
    command:
      - '--path.rootfs=/host'
    depends_on:
      - facultyA-edge

  nginx-exporter-central:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter-central
    ports:
      - "9113:9113"
    networks:
      elvira-net:
        ipv4_address: 172.20.0.7
    command:  # Scrape central's stub_status (your metrics.ts uses it)
      - -nginx.scrape-uri=http://172.20.0.2/stub_status
    depends_on:
      - central-nginx

  nginx-exporter-facultyA:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter-facultyA
    ports:
      - "9114:9113"
    networks:
      elvira-net:
        ipv4_address: 172.20.0.12
    command:
      - -nginx.scrape-uri=http://172.20.0.10/stub_status
    depends_on:
      - facultyA-edge
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest 
    container_name: cadvisor
    ports:
      - "8082:8080"
    networks:
      elvira-net:
        ipv4_address: 172.20.0.13
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro  // Already good for WSL
      - /sys:/sys:ro
    privileged: true
    depends_on:
      - central-nginx
      - facultyA-edge

  dashboard:
    build:
      context: ./elvira-dashboard
      dockerfile: Dockerfile
    ports:
      - "3101:3101"  
    command: npm start
    depends_on:
      - central-nginx
      - prometheus
    networks:
      elvira-net:
        ipv4_address: 172.20.0.20
networks:
  elvira-net:
    driver: bridge
    ipam:
      config:
        - subnet: "172.20.0.0/16"
  facultyA-net:
    driver: bridge
    ipam:
      config:
        - subnet: "192.168.1.0/24"