services:
  central-nginx:
    build:
      context: .
      dockerfile: applications/central-manager/Dockerfile
    image: elvira-simulation-central-nginx
    container_name: central-nginx
    ports:
    - "8080:80"  # Existing
    - "3000:3000"  # For /metrics (Prometheus already scrapes internally, but useful for debug)
    - "3100:3100"  # For /eco-index, /health, etc.
    volumes:
      - ./mock-content:/var/www/books:ro
      - /var/run/docker.sock:/var/run/docker.sock  # Для доступа к Docker daemon
      - .:/project:ro
    networks:
      elvira-net:
        ipv4_address: 172.20.0.2
    depends_on:
      - main-dns
      - secondary-dns
    privileged: true
    environment:
      - STRATEGY=1
      - COMPRESS_ALGO=gzip
      - COMPRESS_LEVEL=6
    profiles: []
  facultyA-edge:
    build:
      context: .
      dockerfile: applications/edge-managers/faculty-edge/Dockerfile
    image: elvira-simulation-edge:facultya
    container_name: facultyA-edge
    ports:
      - "8081:80"
      - "3001:3001"
    volumes:
      - ./data:/var/www/cache:ro
    networks:
      elvira-net:
        ipv4_address: 172.20.0.10
      facultyA-net:
        ipv4_address: 192.168.1.10
    depends_on:
      - central-nginx
    privileged: true
    environment:
      - FACULTY=facultyA
      - CONTROL_PORT=3001
      - STRATEGY=1
      - COMPRESS_ALGO=gzip
      - COMPRESS_LEVEL=6
    profiles: []

  facultyB-edge:
    build:
      context: .
      dockerfile: applications/edge-managers/faculty-edge/Dockerfile
    image: elvira-simulation-edge:facultyb
    container_name: facultyB-edge
    ports:
      - "8082:80"
      - "3002:3002"
    volumes:
      - ./data:/var/www/cache:ro
    networks:
      elvira-net:
        ipv4_address: 172.20.0.20
      facultyB-net:
        ipv4_address: 192.168.2.10
    depends_on:
      - central-nginx
    privileged: true
    environment:
      - FACULTY=facultyB
      - CONTROL_PORT=3002
      - STRATEGY=1
      - COMPRESS_ALGO=gzip
      - COMPRESS_LEVEL=6
    profiles: []

  facultyC-edge:
    build:
      context: .
      dockerfile: applications/edge-managers/faculty-edge/Dockerfile
    image: elvira-simulation-edge:facultyc
    container_name: facultyC-edge
    ports:
      - "8083:80"
      - "3003:3003"
    volumes:
      - ./data:/var/www/cache:ro
    networks:
      elvira-net:
        ipv4_address: 172.20.0.30
      facultyC-net:
        ipv4_address: 192.168.3.10
    depends_on:
      - central-nginx
    privileged: true
    environment:
      - FACULTY=facultyC
      - CONTROL_PORT=3003
      - STRATEGY=1
      - COMPRESS_ALGO=gzip
      - COMPRESS_LEVEL=6
    profiles: []

  facultyD-edge:
    build:
      context: .
      dockerfile: applications/edge-managers/faculty-edge/Dockerfile
    image: elvira-simulation-edge:facultyd
    container_name: facultyD-edge
    ports:
      - "8084:80"
      - "3004:3004"
    volumes:
      - ./data:/var/www/cache:ro
    networks:
      elvira-net:
        ipv4_address: 172.20.0.40
      facultyD-net:
        ipv4_address: 192.168.4.10
    depends_on:
      - central-nginx
    privileged: true
    environment:
      - FACULTY=facultyD
      - CONTROL_PORT=3004
      - STRATEGY=1
      - COMPRESS_ALGO=gzip
      - COMPRESS_LEVEL=6
    profiles: []

  facultyE-edge:
    build:
      context: .
      dockerfile: applications/edge-managers/faculty-edge/Dockerfile
    image: elvira-simulation-edge:facultye
    container_name: facultyE-edge
    ports:
      - "8085:80"
      - "3005:3005"
    volumes:
      - ./data:/var/www/cache:ro
    networks:
      elvira-net:
        ipv4_address: 172.20.0.50
      facultyE-net:
        ipv4_address: 192.168.5.10
    depends_on:
      - central-nginx
    privileged: true
    environment:
      - FACULTY=facultyE
      - CONTROL_PORT=3005
      - STRATEGY=1
      - COMPRESS_ALGO=gzip
      - COMPRESS_LEVEL=6
    profiles: []

  main-dns:
    build:
      context: .
      dockerfile: infra/dns/main/Dockerfile  # Point to the copied Dockerfile
    image: elvira-simulation-main-dns  # New image name
    container_name: main-dns
    ports:
      - "53:53/udp"
    volumes:
      - ./infra/dns/main/Corefile:/Corefile:ro
    networks:
      elvira-net:
        ipv4_address: 172.20.0.3
      facultyA-net: 
        ipv4_address: 192.168.1.3
    profiles: []
  secondary-dns:
    build:
      context: .
      dockerfile: infra/dns/secondary/Dockerfile 
    container_name: secondary-dns
    ports:
      - "1053:53/udp"
    environment:
      - DNS_MODE                          
    networks:
      elvira-net:
        ipv4_address: 172.20.0.4
      facultyA-net:
        ipv4_address: 192.168.1.5
      facultyB-net:
        ipv4_address: 192.168.2.5
      facultyC-net:
        ipv4_address: 192.168.3.5
      facultyD-net:
        ipv4_address: 192.168.4.5
      facultyE-net:
        ipv4_address: 192.168.5.5
    sysctls:
      - net.ipv4.ip_forward=1
    cap_add:
      - NET_ADMIN
    profiles: []
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:               
      elvira-net:
        ipv4_address: 172.20.0.5
    profiles: []
  student-facultyA:
    image: elvira-sim-student:latest
    container_name: student-facultyA
    cap_add:
      - NET_ADMIN
    environment:
      - SIM_CONC=30
      - SIM_DURATION=600
      - SIM_THINK=1000
      - SIM_URL_BASE=http://elvira.lib/books
      - SIM_ZIPF_ALPHA=0.9
      - SIM_MODE=${SIM_MODE}
    networks:
      facultyA-net:
        ipv4_address: 192.168.1.50
    dns:
      - 172.20.0.3
    depends_on:
      - main-dns
      - secondary-dns
    profiles:
      - simulator

  student-facultyB:
    image: elvira-sim-student:latest
    container_name: student-facultyB
    cap_add:
      - NET_ADMIN
    environment:
      - SIM_CONC=25
      - SIM_DURATION=600
      - SIM_THINK=1000
      - SIM_URL_BASE=http://elvira.lib/books
      - SIM_ZIPF_ALPHA=0.9
      - SIM_MODE=${SIM_MODE}
    networks:
      facultyB-net:
        ipv4_address: 192.168.2.50
    dns:
      - 172.20.0.3
    depends_on:
      - main-dns
      - secondary-dns
    profiles:
      - simulator

  student-facultyC:
    image: elvira-sim-student:latest
    container_name: student-facultyC
    cap_add:
      - NET_ADMIN
    environment:
      - SIM_CONC=20
      - SIM_DURATION=600
      - SIM_THINK=1000
      - SIM_URL_BASE=http://elvira.lib/books
      - SIM_ZIPF_ALPHA=0.9
      - SIM_MODE=${SIM_MODE}
    networks:
      facultyC-net:
        ipv4_address: 192.168.3.50
    dns:
      - 172.20.0.3
    depends_on:
      - main-dns
      - secondary-dns
    profiles:
      - simulator

  student-facultyD:
    image: elvira-sim-student:latest
    container_name: student-facultyD
    cap_add:
      - NET_ADMIN
    environment:
      - SIM_CONC=20
      - SIM_DURATION=600
      - SIM_THINK=1000
      - SIM_URL_BASE=http://elvira.lib/books
      - SIM_ZIPF_ALPHA=0.9
      - SIM_MODE=${SIM_MODE}
    networks:
      facultyD-net:
        ipv4_address: 192.168.4.50
    dns:
      - 172.20.0.3
    depends_on:
      - main-dns
      - secondary-dns
    profiles:
      - simulator

  student-facultyE:
    image: elvira-sim-student:latest
    container_name: student-facultyE
    cap_add:
      - NET_ADMIN
    environment:
      - SIM_CONC=20
      - SIM_DURATION=600
      - SIM_THINK=1000
      - SIM_URL_BASE=http://elvira.lib/books
      - SIM_ZIPF_ALPHA=0.9
      - SIM_MODE=${SIM_MODE}
    networks:
      facultyE-net:
        ipv4_address: 192.168.5.50
    dns:
      - 172.20.0.3
    depends_on:
      - main-dns
      - secondary-dns
    profiles:
      - simulator
      
  selenium-client:
    build:
      context: ./applications/simulators/use-case2
      dockerfile: Dockerfile
    image: elvira-selenium-client  
    container_name: selenium-client
    cap_add:
      - NET_ADMIN
    networks:
      facultyA-net:
        ipv4_address: 192.168.1.60
    dns:
      - 192.168.1.3
    depends_on:
      - facultyA-edge
      - main-dns
      - secondary-dns
    profiles:
      - usecase2
    shm_size: 2g
  node-exporter-host:
    image: prom/node-exporter:latest
    container_name: node-exporter-central
    ports:
      - "9100:9100"  # Matches your prometheus.yml
    networks:
      elvira-net:
        ipv4_address: 172.20.0.6
    volumes:
      - /:/host:ro
    command:
      - '--path.rootfs=/host'
    depends_on:
      - central-nginx
    profiles: []

  nginx-exporter-central:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter-central
    ports:
      - "9113:9113"
    networks:
      elvira-net:
        ipv4_address: 172.20.0.7
    command:  # Scrape central's stub_status (your metrics.ts uses it)
      - -nginx.scrape-uri=http://172.20.0.2/stub_status
    depends_on:
      - central-nginx
    profiles: []

  nginx-exporter-facultyA:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter-facultyA
    ports:
      - "9114:9113"
    networks:
      elvira-net:
        ipv4_address: 172.20.0.12
    command:
      - -nginx.scrape-uri=http://172.20.0.10/stub_status
    depends_on:
      - facultyA-edge
    profiles: []
  nginx-exporter-facultyB:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter-facultyB
    ports:
      - "9115:9113"
    networks:
      elvira-net:
        ipv4_address: 172.20.0.16
    command:
      - -nginx.scrape-uri=http://172.20.0.20/stub_status
    depends_on:
      - facultyB-edge

  nginx-exporter-facultyC:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter-facultyC
    ports:
      - "9116:9113"
    networks:
      elvira-net:
        ipv4_address: 172.20.0.17
    command:
      - -nginx.scrape-uri=http://172.20.0.30/stub_status
    depends_on:
      - facultyC-edge

  nginx-exporter-facultyD:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter-facultyD
    ports:
      - "9117:9113"
    networks:
      elvira-net:
        ipv4_address: 172.20.0.18
    command:
      - -nginx.scrape-uri=http://172.20.0.40/stub_status
    depends_on:
      - facultyD-edge

  nginx-exporter-facultyE:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter-facultyE
    ports:
      - "9118:9113"
    networks:
      elvira-net:
        ipv4_address: 172.20.0.19
    command:
      - -nginx.scrape-uri=http://172.20.0.50/stub_status
    depends_on:
      - facultyE-edge
  logporter:
    image: lifailon/logporter:latest       
    container_name: logporter
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  
    ports:
      - 9333:9333
    environment:
      - DOCKER_LOG_METRICS=false
      - DOCKER_LOG_CUSTOM_METRICS=false
      - DOCKER_LOG_CUSTOM_QUERY=(err|error|ERR|ERROR)
    networks:
      elvira-net:
        ipv4_address: 172.20.0.13
    profiles: []
  dashboard:
    build:
      context: ./elvira-dashboard
      dockerfile: Dockerfile
    ports:
      - "3101:3101"  
    # command: npm start
    container_name: elvira-dashboard
    depends_on:
      - central-nginx
      - prometheus
    networks:
      elvira-net:
        ipv4_address: 172.20.0.21
    profiles: []

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3010:3000"                  
    volumes:
      - grafana-data:/var/lib/grafana 
      - ./grafana/provisioning:/etc/grafana/provisioning:ro 
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123  
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      elvira-net:
        ipv4_address: 172.20.0.31  
    depends_on:
      - prometheus
    profiles: []
networks:
  elvira-net:
    driver: bridge
    ipam:
      config:
        - subnet: "172.20.0.0/16"
  facultyA-net:
    driver: bridge
    ipam:
      config:
        - subnet: "192.168.1.0/24"
  facultyB-net:
    driver: bridge
    ipam:
      config:
        - subnet: "192.168.2.0/24"
  facultyC-net:
    driver: bridge
    ipam:
      config:
        - subnet: "192.168.3.0/24"
  facultyD-net:
    driver: bridge
    ipam:
      config:
        - subnet: "192.168.4.0/24"
  facultyE-net:
    driver: bridge
    ipam:
      config:
        - subnet: "192.168.5.0/24"
  
volumes:
  grafana-data: